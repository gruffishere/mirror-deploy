<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIGNED — THE MIRROR</title>
<link rel="stylesheet" href="/cards/faz1.css">
<style>
html,body{margin:0;background:var(--ground);color:var(--lit);
  font:400 16px/1.6 var(--disp);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1720px;margin:0 auto;padding:0 22px 100px}

.top{display:flex;align-items:center;gap:14px;padding:26px 0 4px}
.wm{background:var(--paper);border-radius:8px;padding:5px 10px 6px;display:inline-block}
.wm b{display:block;font:800 clamp(18px,1.8vw,24px)/.86 var(--disp);letter-spacing:-.05em;color:#0101ef}
.top .sub{font:800 11px/1 var(--mono);letter-spacing:.42em;color:var(--dim)}
.top .back{margin-left:auto;font:800 12px/1 var(--mono);letter-spacing:.16em;color:#9a9aa8;
  border:1px solid rgba(255,255,255,.22);border-radius:11px;padding:14px 20px}
.top .back:hover{color:#fff;border-color:rgba(255,255,255,.45)}

h1{font:900 clamp(30px,4.6vw,60px)/1 var(--disp);letter-spacing:-.045em;margin:34px 0 12px;color:#fff}
.lede{color:#9a9aa8;max-width:60ch;margin:0 0 8px}
.count{font:800 12px/1.9 var(--mono);letter-spacing:.2em;color:#6f6f7c;margin:0 0 30px;
  display:flex;flex-wrap:wrap;align-items:baseline;gap:0 16px}
/* the same weight and tracking the live board uses, so the two read as one instrument */
.count .fq{font:800 11px/1 var(--mono);letter-spacing:.16em}

/* ⚠️ EACH TILE IS A REAL CARD PNG, rendered once and then served from disk. `loading="lazy"` is not
   decoration here: without it a board of two hundred signers would ask the server for two hundred
   browser launches the moment somebody opened this page. */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:26px 22px}
.tile img{width:100%;aspect-ratio:16/9;display:block;border-radius:10px;background:#0b0b0e;
  border:1px solid rgba(255,255,255,.10);cursor:zoom-in}
.tile img:hover{border-color:rgba(255,255,255,.28)}

/* ⚠️ THE CARD ITSELF, AND NOTHING ELSE. No chrome, no caption, no buttons: the point of a wall of
   cards is the card, so opening one puts it on the screen and gets out of the way. */
#lb{position:fixed;inset:0;background:rgba(6,6,9,.94);display:none;align-items:center;
/* ⚠️ ABOVE THE TICKER (60). The countdown is fixed to the top of the screen, so a blown-up card
   at 50 opened UNDERNEATH it and the countdown sat across the name on the card. */
  justify-content:center;padding:4vmin;z-index:70;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;border-radius:12px;display:block;
  box-shadow:0 30px 90px rgba(0,0,0,.7)}
/* the wrapper only exists so the badge can sit on the corner of the IMAGE, not of the screen */
#lbw{position:relative;display:inline-block;max-width:100%;max-height:100%;line-height:0}
#lbw .rd{top:13px;right:13px;font-size:12.5px}
/* ⚠️ AN OVERLAY, NOT PART OF THE PICTURE. The card PNG is immutable for a year; this is drawn
   from the live count on every render of the board, so it cannot disagree with itself. */
.rd{position:absolute;font:600 11px/1 var(--mono);color:#d2d2dc;letter-spacing:.06em;
  background:rgba(10,10,14,.74);border:1px solid rgba(255,255,255,.15);
  border-radius:999px;padding:5px 8px;pointer-events:none;white-space:nowrap}
/* ⛔ ABOVE THE THUMBNAIL, NOT ON IT, and the reason is size not taste. The badge is a fixed
   number of pixels while the card shrinks to fit the column, so on a three-across board it
   covered the tail of `approved by facets`. Every corner of that card is already used, so there
   is no free one to move it to. It clears the picture entirely here and stays legible at any
   column width. The lightbox and the wallet page DO overlay it, because at that size the badge
   is a small fraction of the card and sits well above the stamp. */
.tile{position:relative;padding-top:21px}
.tile .rd{top:0;right:2px}
.tile .who{margin-top:9px;display:flex;align-items:baseline;gap:8px}
.tile .nm{font-weight:700;color:#e9e9ef;font-size:15px}
.tile .hd{font:600 12.5px/1 var(--mono);color:#6f6f7c}
.tile .fc{margin-left:auto;font:800 10px/1 var(--mono);letter-spacing:.14em}
.empty{color:#6f6f7c;padding:40px 0}
.filters{margin:0 0 26px;display:flex;flex-direction:column;gap:9px}
/* ⚠️ third time: an explicit display beats the hidden attribute, so it needs its own rule */
.filters[hidden]{display:none}
.filters .row{display:flex;gap:7px;flex-wrap:wrap}
/* two rows, two jobs, so they are not the same shape. The sort is a switch and reads as one; the
   facets are labels and carry their own colour, which is the colour that means that facet
   everywhere else on this site. */
.filters b{font:800 9.5px/1 var(--mono);letter-spacing:.18em;padding:8px 13px;cursor:pointer;
  user-select:none;border:1px solid rgba(255,255,255,.14);color:#8a8a96}
.filters .row.sort b{border-radius:9px}
.filters .row.sort b:first-child{border-top-right-radius:0;border-bottom-right-radius:0;
  border-right:0}
.filters .row.sort b:last-child{border-top-left-radius:0;border-bottom-left-radius:0}
.filters .row.sort{gap:0}
.filters .row.sort b.on{color:#0b0b0e;background:var(--paper);border-color:var(--paper)}
.filters b i{font-style:normal}
.filters .row.facet b{border-radius:999px;border-color:currentColor;opacity:.55}
.filters .row.facet b.on{opacity:1;background:currentColor}
.filters .row.facet b.on span,.filters .row.facet b.on{color:currentColor}
.filters .row.facet b.on i{color:#0b0b0e;font-style:normal}
.filters b:hover{color:#fff;border-color:rgba(255,255,255,.32)}
.filters b.on{color:#0b0b0e;background:#e9e9ef;border-color:#e9e9ef}
.filters b .c{opacity:.55;margin-left:5px}
/* THE CLOCK, PINNED TO THE TOP OF EVERY PAGE.
   ⚠️ display is set here, so [hidden] must be given a display of its own or the attribute does
   nothing: that is exactly how it stayed on screen showing --:--:-- while signing was closed. */
.tkbar{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;justify-content:center;
  pointer-events:none;padding:10px 12px}
.tkbar[hidden]{display:none}
/* ⚠️ ONE RULE, NOT A RULE PLUS A PATCH. The column layout was bolted on under the original row
   layout and left align-items:baseline behind it, so the second line shrank to its own width and
   sat against the left edge while the first stayed centred.
   ⚠️ AND A FIXED RADIUS. 999px reads as a pill on one line and as a lozenge on two: the ends bow
   out as the box gets taller, which is the shape gruff saw on the board. */
.tkbar .in{display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:10px 20px 11px;border-radius:16px;border:1px solid rgba(226,59,109,.55);
  background:rgba(28,8,14,.94);backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.5)}
.tkbar .n{font:800 14px/1 var(--mono);letter-spacing:.05em;color:#fff;font-variant-numeric:tabular-nums}
.tkbar .l{font:800 9.5px/1 var(--mono);letter-spacing:.2em;color:#e88ba4}
.tkbar .sep{color:#7a3a4c}
.tkbar .t{color:var(--DEGEN-lit)}
.tkbar .top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;justify-content:center}
.tkbar .bot{font:700 9px/1.4 var(--mono);letter-spacing:.16em;color:#9a6a78;text-align:center}
/* the page needs room under a bar that floats over it */
/* a first guess only, before tkPaint() has measured the real ticker; never trust it to fit */
body.hastk{padding-top:52px}
/* stated on the board too: this is the page people are sent to, and a list nobody can join any
   more should say so rather than leaving them looking for the button. */
.closed[hidden]{display:none}
.closed{display:inline-block;margin:0 0 30px;font:800 10.5px/1 var(--mono);letter-spacing:.2em;
  color:#9a9aa8;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:9px 15px}
/* the card that never arrived says so, rather than showing the browser's torn-paper icon */
.tile.later img{visibility:hidden}
.tile.later{position:relative}
.tile.later::after{content:'STILL DRAWING';position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;border-radius:10px;background:#0b0b0e;
  border:1px solid rgba(255,255,255,.10);font:800 10px/1 var(--mono);letter-spacing:.2em;
  color:#4a4a55;aspect-ratio:16/9}
</style></head><body>

<div class="tkbar" id="tkbar" hidden><div class="in">
  <div class="top">
    <span class="n" id="tkN">0</span><span class="l">SIGNED</span>
    <span class="sep">&middot;</span>
    <span class="l">CLOSES IN</span><span class="n t" id="tkT">--:--:--</span>
  </div>
  <div class="bot" id="tkB"></div>
</div></div>
<div class="wrap">
  <div class="top">
    <a class="wm" href="/" title="THE MIRROR"><b>FACETS</b></a><span class="sub">THE MIRROR</span>
    <a class="back" href="/">READ A WALLET</a>
  </div>

  <h1>Signed Wallets</h1>
  <p class="count" id="count">…</p>
  <p class="closed" id="closed" hidden>SIGNING IS CLOSED &middot; THIS LIST IS SETTLED</p>

  <div class="filters" id="filters">
    <div class="row facet" id="facets"></div>
  </div>
  <div class="grid" id="grid"></div>
</div>
<div id="lb"><div id="lbw"><img alt=""><span class="rd" id="lbrd" hidden></span></div></div>

<script>
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const short = a => a.slice(0, 6) + '…' + a.slice(-4);

let ARTV = '0';
// THE CLOCK. It draws only what the server says: the count is the signed list and the deadline is
// the file the server closes itself on, so the page cannot show a door that is already shut.
let tkClosesAt = null;
function tkPaint() {
  const box = document.getElementById("tkbar");
  if (!box) return;
  const show = !!tkClosesAt && (tkClosesAt - Date.now()) > 0;
  box.hidden = !show;
  document.body.classList.toggle("hastk", show);
  // ⛔ MEASURED, NOT A NUMBER SOMEBODY TYPED ONCE. The 52px in the stylesheet was written for a
  // one-line ticker and stayed behind when the wallets-read line was added, so on a phone the
  // countdown sat 101px across the header: over the FACETS wordmark, which is also the way back
  // to the front page. This repaints every second, so it also survives a rotation.
  document.body.style.paddingTop = show ? (box.offsetHeight + 6) + "px" : "";
  if (!show) return;
  const left = tkClosesAt - Date.now();
  const h = Math.floor(left / 3600000), m = Math.floor(left / 60000) % 60, sec = Math.floor(left / 1000) % 60;
  const p = n => String(n).padStart(2, "0");
  document.getElementById("tkT").textContent = p(h) + ":" + p(m) + ":" + p(sec);
}
async function tkPoll() {
  try {
    const st = await (await fetch("/api/status")).json();
    document.getElementById("tkN").textContent = st.signed == null ? "0" : st.signed;
    const rd = st.walletsRead == null ? 0 : st.walletsRead;
    const q = st.queue == null ? 0 : st.queue;
    document.getElementById("tkB").textContent =
      rd.toLocaleString('en-US') + ' WALLETS READ  ·  ' + q + ' IN QUEUE';
    tkClosesAt = (st.claimsOpen && st.closesAt) ? st.closesAt : null;
  } catch (e) { }
  tkPaint();
}
tkPoll(); setInterval(tkPoll, 20000); setInterval(tkPaint, 1000);
fetch('/api/status').then(r => r.json())
  .then(st => { ARTV = st.artVersion || '0';
                if (st.claimsOpen === false) document.getElementById('closed').hidden = false; })
  .catch(() => {});

// THE BOARD IS FILTERED IN THE PAGE, not asked for again: every row is already here, and a sort is
// a comparison, not a request.
// ⚠️ NEWEST, ALWAYS. The sort switch is gone: the only other order anyone asked for was most read,
// and the wallets that would actually top that list are the three on the front page, which have
// not signed and do not belong on a board of people who did.
let ROWS = [], FACET = '';
function draw() {
  let rows = ROWS.slice();
  if (FACET) rows = rows.filter(r => r.facet === FACET);
  rows.sort((a, b) => (a.t < b.t ? 1 : -1));
  document.getElementById('count').textContent =
    rows.length + (rows.length === 1 ? ' WALLET' : ' WALLETS') + (FACET ? ' · ' + FACET : '');
  document.getElementById('grid').innerHTML = rows.length ? rows.map(r =>
    '<div class="tile">' +
      '<img loading="lazy" alt="" data-full="1" data-tries="0" ' +
        'data-reads="' + (r.reads || 0) + '" ' +
        'src="/api/card.png?addr=' + encodeURIComponent(r.addr) + '&v=' + encodeURIComponent(ARTV) + '">' +
      (r.reads > 1 ? '<span class="rd">READ ' + r.reads + '&times;</span>' : '') +
      '<div class="who">' +
        '<span class="nm">' + esc(r.name || short(r.addr)) + '</span>' +
        (r.handle ? '<span class="hd">@' + esc(r.handle) + '</span>' : '') +
        (r.facet ? '<span class="fc" style="color:var(--' + r.facet + '-lit)">' + esc(r.facet) + '</span>' : '') +
      '</div>' +
    '</div>').join('') : '<p class="empty">Nobody here yet.</p>';
}
function chips() {
  const counts = {};
  ROWS.forEach(r => { if (r.facet) counts[r.facet] = (counts[r.facet] || 0) + 1; });
  // ⚠️ the chip carries the facet's own colour, the same one the card and the bars use. currentColor
  // then drives the border, the text and the filled state from that one value.
  const chip = (f, label, n, on) =>
    '<b data-facet="' + f + '"' + (on ? ' class="on"' : '') +
    (f ? ' style="color:var(--' + f + '-lit)"' : ' style="color:#9a9aa8"') + '>' +
    '<i>' + label + '<span class="c">' + n + '</span></i></b>';
  document.getElementById('facets').innerHTML =
    chip('', 'ALL', ROWS.length, !FACET) +
    Object.keys(counts).sort((a, b) => counts[b] - counts[a])
      .map(f => chip(f, f, counts[f], FACET === f)).join('');
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.filters b');
  if (!b) return;
  if (b.dataset.facet != null) FACET = b.dataset.facet;
  chips(); draw();
});

fetch('/api/signed').then(r => r.json()).then(j => {
  // ⚠️ COUNTED FROM THE ROWS ON SCREEN, not from a second endpoint, so the tally and the tiles can
  // never disagree about what is on this page.
  const ORDER = ['NEWBIE', 'COLLECTOR', 'DEGEN', 'BUILDER', 'OG', 'WHALE', 'GHOST'];
  const by = {};
  (j.rows || []).forEach(r => { if (r.facet) by[r.facet] = (by[r.facet] || 0) + 1; });
  document.getElementById('count').innerHTML =
    (j.n === 0 ? 'NOBODY YET' : j.n + (j.n === 1 ? ' WALLET' : ' WALLETS')) +
    ORDER.filter(f => by[f]).map(f =>
      '<span class="fq" style="color:var(--' + f + '-lit)">' + f + ' ' + by[f] + '</span>').join('');
  if (!j.n) {
    document.getElementById('filters').hidden = true;
    document.getElementById('grid').outerHTML =
      '<p class="empty">Nobody has signed yet. The first card here will be somebody’s.</p>';
    return;
  }
  // one place builds the tiles, and the filters feed it
  ROWS = j.rows || [];
  chips(); draw();
}).catch(() => {
  document.getElementById('count').textContent = 'could not load the list';
});

// ⚠️ A CARD THAT IS NOT DRAWN YET IS NOT A BROKEN CARD.
// Rendering is serialised and rationed, so on a board nobody has opened before, the later tiles can
// come back 429 while the queue works through the earlier ones. The browser draws its broken-image
// mark for that, which reads as a fault in the card rather than a card still being made. Each tile
// waits and asks again instead, twice, spaced out, and only then gives up quietly.
document.addEventListener('error', e => {
  const t = e.target;
  if (!t || t.tagName !== 'IMG' || !t.dataset.full) return;
  const n = +(t.dataset.tries || 0);
  if (n >= 5) { const tile = t.closest('.tile'); if (tile) tile.classList.add('later'); return; }
  t.dataset.tries = n + 1;
  const src = t.src.split('&_')[0];
  setTimeout(() => { t.src = src + '&_=' + n; }, 3000 * (n + 1));   // 3s, 6s, 9s, 12s, 15s
}, true);

// ⚠️ delegated, because the tiles are built after this runs and rebuilt whenever the list changes
const lb = document.getElementById('lb'), lbimg = lb.querySelector('img');
const lbrd = document.getElementById('lbrd');
document.addEventListener('click', e => {
  const t = e.target;
  if (t && t.dataset && t.dataset.full) {
    lbimg.src = t.src;
    // the blown-up card carries the same live number the tile did, so clicking cannot change it
    const n = +(t.dataset.reads || 0);
    lbrd.textContent = 'READ ' + n + '×'; lbrd.hidden = !(n > 1);
    lb.classList.add('on'); return;
  }
  if (lb.classList.contains('on')) { lb.classList.remove('on'); lbimg.src = ''; }
});
addEventListener('keydown', e => {
  if (e.key === 'Escape' && lb.classList.contains('on')) { lb.classList.remove('on'); lbimg.src = ''; }
});
</script>
</body></html>
